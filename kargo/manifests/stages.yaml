apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: dummy-go-app
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dummy-go-app
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: integration-test
    args:
      - name: stage
        value: dev
  promotionTemplate:
    spec:
      steps:
        - task:
            name: helm-promote
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: dummy-go-app
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dummy-go-app
      sources:
        stages:
          - dev
  verification:
    analysisTemplates:
      - name: integration-test
    args:
      - name: stage
        value: staging
  promotionTemplate:
    spec:
      steps:
        - task:
            name: helm-promote
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: dummy-go-app
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dummy-go-app
      sources:
        stages:
          - staging
  verification:
    analysisTemplates:
      - name: integration-test
    args:
      - name: stage
        value: production
  promotionTemplate:
    spec:
      steps:
        - task:
            name: helm-promote
