apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dummy-go-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adamplansky/dummy-go-app.git
    targetRevision: HEAD
    path: helm-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: dummy-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true