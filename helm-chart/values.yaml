# Base values - common configuration for all environments
# Environment-specific values files (values-dev.yaml, values-production.yaml)
# should only override what differs from these defaults.

podinfo:
  # Image configuration
  image:
    repository: ghcr.io/stefanprodan/podinfo
    tag: 6.9.4

  # Ingress - base structure (host overridden per environment)
  ingress:
    enabled: true
    className: nginx

  ui:
    message: "trigger2"
    color: "#CC561E"

  # Service configuration (same across all environments)
  service:
    enabled: true
    type: ClusterIP
    httpPort: 9898

  hpa:
    enabled: false
