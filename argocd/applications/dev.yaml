apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dummy-go-app-dev
  namespace: argocd
  labels:
    environment: dev
    app: dummy-go-app
spec:
  project: default
  source:
    repoURL: https://github.com/adamplansky/dummy-go-app.git
    targetRevision: HEAD
    path: helm-chart
    helm:
      valueFiles:
        - values.yaml # Base values (loaded first)
        - values-dev.yaml # Dev overrides (loaded second, overrides base)
  destination:
    server: https://kubernetes.default.svc
    namespace: dummy-app-dev
  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
