apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dummy-go-app-production
  namespace: argocd
  labels:
    environment: production
    app: dummy-go-app
spec:
  project: default
  source:
    repoURL: https://github.com/adamplansky/dummy-go-app.git
    targetRevision: HEAD
    path: helm-chart
    helm:
      valueFiles:
        - values.yaml # Base values (loaded first)
        - values-production.yaml # Production overrides (loaded second, overrides base)
  destination:
    server: https://kubernetes.default.svc
    namespace: dummy-app-production
  syncPolicy:
    # automated:
    #   prune: false      # Don't auto-delete resources in production
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
